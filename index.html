<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survei Imunisasi Komunitas</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--tx:#15231d;--mu:#5d6e66;--bd:#d6e0db;--pr:#1D9E75;--pd:#0F6E56;--soft:#E1F5EE;--er:#C2410C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#17221e;--tx:#e8f1ed;--mu:#9fb2a9;--bd:#2a3a34;--soft:#1a3a2f;--er:#fb923c}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#17221e;--tx:#e8f1ed;--mu:#9fb2a9;--bd:#2a3a34;--soft:#1a3a2f;--er:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.hd{background:var(--pr);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.hd h1{font-size:18px;margin:0 0 2px}.hd p{margin:0;font-size:12px;opacity:.9}
.st{display:inline-block;margin-top:8px;font-size:11px;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.pg{font-size:12px;color:var(--mu);margin-bottom:6px;display:flex;justify-content:space-between}
.bar{height:5px;background:var(--bd);border-radius:5px;margin-bottom:14px}.bar i{display:block;height:5px;background:var(--pr);border-radius:5px}
h2{font-size:15px;margin:0 0 12px;color:var(--pd)}
.q{margin-bottom:16px;padding:8px;border-radius:10px;border:1px solid transparent}
.q.err{border-color:var(--er)}
.l{font-weight:600;margin-bottom:6px;font-size:14px}.l b{color:var(--er);margin-left:3px}
.h{font-size:12px;color:var(--mu);margin:-4px 0 6px}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:0}
.op{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.op:before{content:"";width:16px;height:16px;border:2px solid var(--mu);border-radius:50%;flex:none}
.op.c:before{border-radius:4px}
.op.on{border-color:var(--pr);background:var(--soft)}.op.on:before{background:var(--pr);border-color:var(--pr)}
.sc{display:flex;gap:6px}.sc button{flex:1;padding:12px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.sc button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.sl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:4px}
.nav{display:flex;gap:8px}.nav button,.btn{padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.nav .back{flex:1}.nav .nx,.btn.p{flex:2;background:var(--pr);border-color:var(--pr);color:#fff}
.msg{color:var(--er);font-size:13px;margin:0 0 10px}
.big{font-size:28px;font-weight:700;color:var(--pd)}
.br{margin-bottom:9px;font-size:13px}.br div{display:flex;justify-content:space-between}
.br span.t{display:block;height:8px;background:var(--bd);border-radius:6px;margin-top:3px}.br span.t i{display:block;height:8px;background:var(--pr);border-radius:6px}
.row{padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}.row:last-child{border:0}.row small{color:var(--mu)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok{text-align:center;padding:24px 8px}
</style></head><body><div class="w">
<div class="hd"><h1>Survei Imunisasi Komunitas</h1><p>Aplikasi kader · isi cepat di lapangan</p><span class="st" id="st">Menghubungkan…</span></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
</div>
<script>
const NK="Individu tanpa tanggungan anak",TA="Tidak ada hambatan";
const P=[
{t:"Data responden",f:[
{k:"tgl",l:"Tanggal survei",ty:"date",r:1},
{k:"kader",l:"Nama kader/petugas",ty:"text",r:1},
{k:"kel",l:"Kelurahan/desa",ty:"text",r:1},
{k:"rtrw",l:"RT/RW",ty:"text",r:1,ph:"Contoh: 05/02"},
{k:"usia",l:"Kelompok usia responden",ty:"r",r:1,o:["Di bawah 18 tahun","18–30 tahun","31–45 tahun","46–60 tahun","Di atas 60 tahun"]},
{k:"status",l:"Status dalam keluarga",ty:"r",r:1,o:["Orang tua/wali anak","Ibu hamil/berencana hamil",NK,"Lainnya"]},
{k:"jk",l:"Jenis kelamin",ty:"r",r:1,o:["Laki-laki","Perempuan"]},
{k:"pend",l:"Pendidikan terakhir",ty:"r",o:["Tidak sekolah","SD","SMP","SMA/SMK","Diploma/S1 ke atas"]}]},
{t:"Partisipasi & akses imunisasi",f:[
{k:"imun",l:"Apakah imunisasi dasar anak sudah lengkap?",ty:"r",r:1,o:["Ya, sudah lengkap","Sudah sebagian","Belum sama sekali"],show:a=>a.status!==NK},
{k:"tempat",l:"Tempat layanan imunisasi",ty:"c",r:1,h:"Boleh pilih lebih dari satu",o:["Posyandu","Puskesmas","Klinik/RS swasta","Bidan/dokter praktik mandiri","Belum pernah mengakses"]},
{k:"hambat",l:"Hambatan akses imunisasi",ty:"c",r:1,h:"Boleh pilih lebih dari satu",o:["Jarak jauh","Jadwal tidak sesuai","Biaya","Kurang informasi","Khawatir efek samping",TA]}]},
{t:"Pengetahuan & masukan",f:[
{k:"paham",l:"Seberapa paham manfaat imunisasi?",ty:"s",r:1,lo:"Tidak paham",hi:"Sangat paham"},
{k:"sumber",l:"Sumber informasi imunisasi",ty:"c",h:"Boleh pilih lebih dari satu",o:["Tenaga kesehatan","Kader Posyandu","Keluarga/kerabat","Media sosial","Website resmi pemerintah"]},
{k:"info",l:"Pernah mendengar informasi yang meragukan keamanan vaksin?",ty:"r",r:1,o:["Ya, dan sempat ragu","Ya, tapi tetap percaya vaksin","Tidak pernah"]},
{k:"puas",l:"Kepuasan terhadap layanan imunisasi",ty:"s",r:1,lo:"Tidak puas",hi:"Sangat puas"},
{k:"saran",l:"Saran untuk program imunisasi komunitas",ty:"ta"}]}];
const FM={};let n=0;P.forEach(p=>p.f.forEach(f=>{f.n=++n;FM[f.k]=f}));
const today=()=>new Date().toISOString().slice(0,10);
let ans={tgl:today()},step=0,tab="isi",done=false,errs=[],msg="",rows=[],online=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const LS={get(){try{return JSON.parse(localStorage.getItem("pend")||"[]")}catch(e){return[]}},set(v){try{localStorage.setItem("pend",JSON.stringify(v))}catch(e){}}};
const vis=f=>!f.show||f.show(ans);
function keep(fn){const y=scrollY;fn();scrollTo(0,y)}
function pick(k,i){const f=FM[k];keep(()=>{ans[k]=f.o[i];if(k==="status"&&ans.status===NK)delete ans.imun;errs=[];draw()})}
function tog(k,i){const f=FM[k],v=f.o[i],a=ans[k]||[];keep(()=>{let r=a.includes(v)?a.filter(x=>x!==v):[...a,v];if(k==="hambat"){r=v===TA&&!a.includes(TA)?[TA]:r.filter(x=>x!==TA||v===TA)}ans[k]=r;errs=[];draw()})}
function sc(k,v){keep(()=>{ans[k]=v;errs=[];draw()})}
function fld(f){
const e=errs.includes(f.k)?" err":"";
let h=`<div class="q${e}"><div class="l">${f.n}. ${f.l}${f.r?"<b>*</b>":""}</div>${f.h?`<div class="h">${f.h}</div>`:""}`;
if(f.ty==="text"||f.ty==="date")h+=`<input type="${f.ty}" value="${esc(ans[f.k])}" placeholder="${esc(f.ph||"")}" oninput="ans['${f.k}']=this.value">`;
else if(f.ty==="ta")h+=`<textarea rows="3" oninput="ans['${f.k}']=this.value">${esc(ans[f.k])}</textarea>`;
else if(f.ty==="r")h+=f.o.map((o,i)=>`<button type="button" class="op${ans[f.k]===o?" on":""}" onclick="pick('${f.k}',${i})">${esc(o)}</button>`).join("");
else if(f.ty==="c")h+=f.o.map((o,i)=>`<button type="button" class="op c${(ans[f.k]||[]).includes(o)?" on":""}" onclick="tog('${f.k}',${i})">${esc(o)}</button>`).join("");
else if(f.ty==="s")h+=`<div class="sc">${[1,2,3,4,5].map(v=>`<button type="button" class="${ans[f.k]===v?"on":""}" onclick="sc('${f.k}',${v})">${v}</button>`).join("")}</div><div class="sl"><span>1 = ${f.lo}</span><span>5 = ${f.hi}</span></div>`;
return h+"</div>"}
function missing(){const m=[];P.forEach((p,pi)=>p.f.forEach(f=>{if(!f.r||!vis(f))return;const v=ans[f.k];if(v==null||v===""||(Array.isArray(v)&&!v.length))m.push({k:f.k,pi})}));return m}
function next(){const m=missing().filter(x=>x.pi===step);if(m.length){errs=m.map(x=>x.k);msg="Lengkapi pertanyaan bertanda * yang ditandai.";draw();return}msg="";errs=[];step++;draw();scrollTo(0,0)}
function back(){step--;msg="";errs=[];draw();scrollTo(0,0)}
async function submit(){
const m=missing();if(m.length){step=m[0].pi;errs=m.map(x=>x.k);msg="Masih ada pertanyaan wajib yang kosong.";draw();return}
if(ans.status===NK)ans.imun="Tidak memiliki anak";
const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const rec={...ans,id,ts:Date.now()};
const q=LS.get();q.push(rec);LS.set(q);
done=true;draw();scrollTo(0,0);sync()}
const API="https://script.google.com/macros/s/AKfycbyucdLxUYUw6J5l0flWYG0LteH1cAUxWIEoWYGNhqKa2rU6mp5pX-mpIJflElkETOyUNw/exec";
function kode(){let k="";try{k=localStorage.getItem("kode")||""}catch(e){}if(!k){k=prompt("Masukkan kode kader:")||"";try{localStorage.setItem("kode",k)}catch(e){}}return k}
async function sync(){
for(const r of LS.get()){try{const res=await fetch(API,{method:"POST",body:JSON.stringify({kode:kode(),rec:r})});const j=await res.json();if(j.error){try{localStorage.removeItem("kode")}catch(e){}throw 0}if(!j.ok)throw 0;LS.set(LS.get().filter(x=>x.id!==r.id));online=true}catch(e){online=false;break}}
stat()}
async function load(){try{const r=await fetch(API+"?kode="+encodeURIComponent(kode()));const j=await r.json();if(j.error){try{localStorage.removeItem("kode")}catch(e){}throw 0}rows=j.rows;online=true;stat();if(tab!=="isi")draw()}catch(e){online=false;stat()}}
function stat(){const p=LS.get().length;$("st").textContent=(online?"Online":"Offline")+(p?` · ${p} data menunggu sinkron`:online?" · semua data tersinkron":" · data disimpan di perangkat")}
function reset(){const k={tgl:ans.tgl,kader:ans.kader,kel:ans.kel,rtrw:ans.rtrw};ans=k;step=0;done=false;errs=[];msg="";draw();scrollTo(0,0)}
function bars(title,items,total){return `<h2>${title}</h2>`+(items.map(([l,c])=>`<div class="br"><div><span>${esc(l)}</span><span>${c} (${total?Math.round(c/total*100):0}%)</span></div><span class="t"><i style="width:${total?c/total*100:0}%"></i></span></div>`).join("")||"<p class='h'>Belum ada data.</p>")}
function cnt(k,opts,multi){return opts.map(o=>[o,rows.filter(r=>multi?(r[k]||[]).includes(o):r[k]===o).length])}
function avg(k){const v=rows.map(r=>r[k]).filter(x=>typeof x==="number");return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):"–"}
function rekap(){
const t=rows.length,kids=rows.filter(r=>r.imun&&r.imun!=="Tidak memiliki anak").length;
const kel={};rows.forEach(r=>{const k=(r.kel||"?").trim();kel[k]=(kel[k]||0)+1});
return `<div class="card"><div class="g"><div><div class="big">${t}</div><div class="h">Total responden</div></div><div><div class="big">${t?Math.round(rows.filter(r=>r.imun==="Ya, sudah lengkap").length/Math.max(kids,1)*100):0}%</div><div class="h">Imunisasi lengkap (dari ${kids} keluarga beranak)</div></div><div><div class="big">${avg("paham")}</div><div class="h">Rata-rata pemahaman (1–5)</div></div><div><div class="big">${avg("puas")}</div><div class="h">Rata-rata kepuasan (1–5)</div></div></div></div>
<div class="card">${bars("Status imunisasi",cnt("imun",["Ya, sudah lengkap","Sudah sebagian","Belum sama sekali","Tidak memiliki anak"]),t)}</div>
<div class="card">${bars("Hambatan akses",cnt("hambat",FM.hambat.o,1),t)}</div>
<div class="card">${bars("Informasi meragukan vaksin",cnt("info",FM.info.o),t)}</div>
<div class="card">${bars("Responden per wilayah",Object.entries(kel).sort((a,b)=>b[1]-a[1]).slice(0,8),t)}</div>`}
function data(){
const l=[...rows].sort((a,b)=>b.ts-a.ts);
return `<div class="card"><button class="btn p" style="width:100%" onclick="exportCsv()" id="dl">Unduh data (CSV untuk Excel/Epi Info)</button></div><div class="card">${l.map(r=>`<div class="row"><b>${esc(r.kel)} · RT/RW ${esc(r.rtrw)}</b><br><small>${esc(r.tgl)} · kader ${esc(r.kader)} · ${esc(r.usia)} · ${esc(r.imun||"-")}</small></div>`).join("")||"<p class='h'>Belum ada data masuk.</p>"}</div>`}
async function exportCsv(){
const ks=Object.keys(FM),q=v=>`"${String(Array.isArray(v)?v.join("; "):(v??"")).replace(/"/g,'""')}"`;
const csv="\ufeff"+[ks.join(",")].concat(rows.map(r=>ks.map(k=>q(r[k])).join(","))).join("\r\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="survei-imunisasi.csv";a.click()}
function draw(){
$("tabs").innerHTML=[["isi","Isi survei"],["rekap","Rekap"],["data","Data"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';draw();if(tab!=='isi')load()">${l}</button>`).join("");
const a=$("app");
if(tab==="rekap"){a.innerHTML=rekap();return}
if(tab==="data"){a.innerHTML=data();return}
if(done){a.innerHTML=`<div class="card ok"><div class="big">✓</div><h2>Terima kasih!</h2><p class="h">Data tersimpan${online?" dan dikirim ke server":" di perangkat; akan terkirim saat online"}.</p><button class="btn p" style="width:100%" onclick="reset()">Isi survei baru</button></div>`;return}
const p=P[step],last=step===P.length-1;
a.innerHTML=`<div class="card"><div class="pg"><span>Halaman ${step+1} dari ${P.length}</span><span>${Math.round((step+1)/P.length*100)}%</span></div><div class="bar"><i style="width:${(step+1)/P.length*100}%"></i></div><h2>${p.t}</h2>${p.f.filter(vis).map(fld).join("")}${msg?`<p class="msg">${msg}</p>`:""}<div class="nav">${step?`<button class="back" onclick="back()">← Kembali</button>`:""}<button class="nx" onclick="${last?"submit()":"next()"}">${last?"Simpan ✓":"Lanjut →"}</button></div></div>`}
draw();stat();load();sync();
addEventListener("online",()=>{sync();load()});
</script></body></html>
